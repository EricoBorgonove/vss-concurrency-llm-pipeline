services:
  pipeline:
    platform: linux/amd64
    build:
      context: .
    image: vss-llm-pipeline:local
    working_dir: /workspace
    environment:
      AFL_SKIP_CPUFREQ: "1"
      AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
      PYTHONUNBUFFERED: "1"
    init: true
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined
    volumes:
      - .:/workspace
    command: ["python3", "run_pipeline.py"]
