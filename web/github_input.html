<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links GitHub - Pipeline VSS-LLM</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6f8;
      --surface: #ffffff;
      --line: #d9e2ec;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #2563eb;
      --header: #e4edf7;
      --danger: #b42318;
      --danger-bg: #fff1f0;
      --soft: #eef4ff;
      --success: #157f3b;
    }
    * {
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      margin: 0;
    }
    body.modal-open {
      overflow: hidden;
    }
    main {
      margin: 0 auto;
      padding: 28px 16px 40px;
      width: min(1180px, 100%);
    }
    h1 {
      font-size: 28px;
      margin: 0 0 18px;
    }
    .page-header {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .page-header h1 {
      margin: 0;
    }
    form {
      align-items: end;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(240px, 1fr) auto;
      margin-bottom: 20px;
      padding: 14px;
    }
    label {
      color: var(--muted);
      display: grid;
      font-size: 13px;
      gap: 6px;
    }
    input, button, select, .button-link {
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      min-height: 38px;
      padding: 8px 10px;
    }
    button, .button-link {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      cursor: pointer;
    }
    .button-link {
      align-items: center;
      display: inline-flex;
      justify-content: center;
      text-decoration: none;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    .button-secondary {
      background: var(--soft);
      border-color: #b7cdfb;
      color: #1e3a8a;
    }
    .button-danger {
      background: var(--danger-bg);
      border-color: #f1b3ad;
      color: var(--danger);
    }
    .button-plain {
      background: #ffffff;
      border-color: var(--line);
      color: var(--muted);
    }
    .message {
      color: var(--muted);
      min-height: 22px;
      margin: 0 0 10px;
    }
    .message.error {
      color: var(--danger);
    }
    .message.success {
      color: var(--success);
    }
    .run-panel {
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr) auto;
      margin-bottom: 12px;
      padding: 12px 14px;
    }
    .run-panel h2 {
      font-size: 16px;
      margin: 0 0 4px;
    }
    .run-status {
      color: var(--muted);
      margin: 0;
    }
    .run-status.error {
      color: var(--danger);
    }
    .run-status.success {
      color: var(--success);
    }
    .progress-track {
      background: #e5edf7;
      border: 1px solid var(--line);
      border-radius: 999px;
      height: 10px;
      margin-top: 8px;
      overflow: hidden;
      width: 100%;
    }
    .progress-track[hidden] {
      display: none;
    }
    .progress-fill {
      background: var(--accent);
      height: 100%;
      transition: width 180ms ease;
      width: 0%;
    }
    .table-wrap {
      overflow-x: auto;
    }
    .links-list {
      display: grid;
      gap: 12px;
    }
    .link-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      gap: 12px;
      padding: 14px;
    }
    .link-card-header {
      align-items: start;
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr) auto;
    }
    .link-url {
      color: var(--accent);
      overflow-wrap: anywhere;
      text-decoration: none;
    }
    .link-meta {
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      margin-top: 4px;
    }
    .badge {
      background: #edf2f7;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      display: inline-flex;
      line-height: 1;
      padding: 5px 8px;
      white-space: nowrap;
    }
    .badge-success {
      background: #ecfdf3;
      border-color: #b7e4c7;
      color: var(--success);
    }
    .badge-error {
      background: var(--danger-bg);
      border-color: #f1b3ad;
      color: var(--danger);
    }
    .link-details {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    .detail-item {
      min-width: 0;
    }
    .detail-label {
      color: var(--muted);
      display: block;
      font-size: 12px;
      margin-bottom: 3px;
    }
    .detail-value {
      overflow-wrap: anywhere;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .actions button {
      min-width: 126px;
    }
    .stage-actions {
      align-items: flex-end;
      display: grid;
      gap: 8px;
      justify-items: end;
    }
    .stage-label {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }
    .review-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .review-actions button {
      min-width: 132px;
    }
    .review-summary {
      align-items: center;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr) auto;
      padding-top: 12px;
    }
    .modal-backdrop {
      align-items: center;
      background: rgba(15, 23, 42, 0.52);
      display: none;
      inset: 0;
      justify-content: center;
      padding: 20px;
      position: fixed;
      z-index: 20;
    }
    .modal-backdrop.is-open {
      display: flex;
    }
    .modal {
      background: var(--surface);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      max-height: min(88vh, 860px);
      width: min(1120px, 100%);
    }
    .modal-small {
      width: min(960px, 100%);
    }
    .modal-header,
    .modal-footer {
      align-items: center;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      padding: 14px;
    }
    .modal-footer {
      border-bottom: 0;
      border-top: 1px solid var(--line);
    }
    .modal-title {
      min-width: 0;
    }
    .modal-title h2 {
      font-size: 18px;
      margin: 0;
    }
    .modal-title p {
      color: var(--muted);
      margin: 4px 0 0;
      overflow-wrap: anywhere;
    }
    .modal-body {
      overflow: auto;
      padding: 14px;
    }
    .modal-panel {
      background: #f8fbff;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px;
    }
    .modal-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .modal-filters {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }
    .finding-list {
      display: grid;
      gap: 8px;
    }
    .finding-item {
      background: #fbfdff;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      gap: 8px;
      padding: 10px;
    }
    .finding-topline {
      align-items: start;
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(0, 1fr) auto;
    }
    .finding-message {
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .finding-evidence {
      background: #f4f7fb;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: #334e68;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      margin: 0;
      overflow-x: auto;
      padding: 8px;
      white-space: pre-wrap;
    }
    .finding-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .finding-actions button {
      min-width: 112px;
    }
    .validation-list {
      display: grid;
      gap: 6px;
    }
    .validation-item {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 6px;
      display: grid;
      gap: 6px;
      padding: 8px;
    }
    .log-link {
      background: transparent;
      border: 0;
      color: var(--accent);
      cursor: pointer;
      font: inherit;
      min-height: 0;
      overflow-wrap: anywhere;
      padding: 0;
      text-align: left;
      text-decoration: underline;
      width: auto;
    }
    .log-output {
      background: #0f172a;
      border-radius: 6px;
      color: #e5e7eb;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      margin: 0;
      max-height: 62vh;
      overflow: auto;
      padding: 12px;
      white-space: pre-wrap;
    }
    .pager-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    table {
      background: var(--surface);
      border-collapse: collapse;
      font-size: 14px;
      width: 100%;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: var(--header);
      color: #102a43;
      position: sticky;
      top: 0;
    }
    tr:nth-child(even) {
      background: #f9fbfd;
    }
    .empty {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      padding: 16px;
    }
    @media (max-width: 720px) {
      form {
        grid-template-columns: 1fr;
      }
      .link-card-header {
        grid-template-columns: 1fr;
      }
      .actions {
        justify-content: stretch;
      }
      .stage-actions {
        align-items: stretch;
        justify-items: stretch;
      }
      .stage-label {
        text-align: left;
      }
      .page-header {
        align-items: stretch;
      }
      .review-summary {
        grid-template-columns: 1fr;
      }
      .run-panel {
        grid-template-columns: 1fr;
      }
      .review-actions {
        justify-content: stretch;
      }
      .finding-topline {
        grid-template-columns: 1fr;
      }
      button, .button-link {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <h1>Links do GitHub</h1>
      <div class="actions">
        <a class="button-link button-secondary" href="/validacoes">
          Abrir validações
        </a>
        <a class="button-link" href="/reports/report.html" target="_blank" rel="noopener">
          Abrir relatório dos benchmarks
        </a>
        <a class="button-link button-secondary" href="/logout">
          Sair
        </a>
      </div>
    </header>
    <form id="github-form">
      <label>URL
        <input id="github-url" name="url" type="url" required placeholder="https://github.com/user/repo">
      </label>
      <button id="submit-button" type="submit">Adicionar link</button>
    </form>
    <section class="run-panel">
      <div>
        <h2>Validações dos links do GitHub</h2>
        <p id="github-validation-run-status" class="run-status">Pronto para rodar todos os achados.</p>
        <div id="github-validation-progress" class="progress-track" role="progressbar" aria-label="Progresso dos testes GitHub" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
          <div id="github-validation-progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <button id="run-github-validations-button" type="button">Rodar testes dos links</button>
    </section>
    <p id="message" class="message"></p>
    <div id="links-container" class="table-wrap"></div>
  </main>
  <div id="findings-modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="findings-modal-title">
    <section class="modal">
      <header class="modal-header">
        <div class="modal-title">
          <h2 id="findings-modal-title">Achados para revisão</h2>
          <p id="findings-modal-subtitle"></p>
        </div>
        <button id="close-findings-modal" class="button-plain" type="button">Fechar</button>
      </header>
      <div id="findings-modal-body" class="modal-body"></div>
      <footer class="modal-footer">
        <span id="findings-page-label" class="badge">0 achados</span>
        <div class="pager-actions">
          <button id="findings-prev-page" class="button-secondary" type="button">Anterior</button>
          <button id="findings-next-page" class="button-secondary" type="button">Próxima</button>
        </div>
      </footer>
    </section>
  </div>
  <div id="log-modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="log-modal-title">
    <section class="modal modal-small">
      <header class="modal-header">
        <div class="modal-title">
          <h2 id="log-modal-title">Saída da ferramenta</h2>
          <p id="log-modal-subtitle"></p>
        </div>
        <button id="close-log-modal" class="button-plain" type="button">Fechar</button>
      </header>
      <div class="modal-body">
        <pre id="log-modal-content" class="log-output">Carregando...</pre>
      </div>
    </section>
  </div>
  <script>
    const form = document.getElementById('github-form');
    const urlInput = document.getElementById('github-url');
    const button = document.getElementById('submit-button');
    const message = document.getElementById('message');
    const container = document.getElementById('links-container');
    const runGithubValidationsButton = document.getElementById('run-github-validations-button');
    const githubValidationRunStatus = document.getElementById('github-validation-run-status');
    const githubValidationProgress = document.getElementById('github-validation-progress');
    const githubValidationProgressFill = document.getElementById('github-validation-progress-fill');
    const modalBackdrop = document.getElementById('findings-modal-backdrop');
    const modalTitle = document.getElementById('findings-modal-title');
    const modalSubtitle = document.getElementById('findings-modal-subtitle');
    const modalBody = document.getElementById('findings-modal-body');
    const closeModalButton = document.getElementById('close-findings-modal');
    const pageLabel = document.getElementById('findings-page-label');
    const prevPageButton = document.getElementById('findings-prev-page');
    const nextPageButton = document.getElementById('findings-next-page');
    const logModalBackdrop = document.getElementById('log-modal-backdrop');
    const logModalTitle = document.getElementById('log-modal-title');
    const logModalSubtitle = document.getElementById('log-modal-subtitle');
    const logModalContent = document.getElementById('log-modal-content');
    const closeLogModalButton = document.getElementById('close-log-modal');
    const findingsPageSize = 50;
    let currentLinks = [];
    let currentFindings = [];
    let currentValidations = [];
    let currentModalLinkId = '';
    let currentFindingPage = 0;
    let currentFindingFilters = {
      category: '',
      priority: '',
      status: '',
      validation: ''
    };
    let githubValidationPollTimer = null;

    function setMessage(text, type = '') {
      message.textContent = text;
      message.className = `message ${type}`.trim();
    }

    function setGithubValidationStatus(text, type = '') {
      githubValidationRunStatus.innerHTML = text;
      githubValidationRunStatus.className = `run-status ${type}`.trim();
    }

    function setGithubValidationProgress(run = {}) {
      const status = run.status || 'idle';
      const processed = Number(run.processed || 0);
      const total = Number(run.total || 0);
      const shouldShow = status === 'running' || total > 0;
      githubValidationProgress.hidden = !shouldShow;

      if (!shouldShow) {
        githubValidationProgressFill.style.width = '0%';
        githubValidationProgress.setAttribute('aria-valuenow', '0');
        return;
      }

      const percent = total ? Math.min(100, Math.round((processed / total) * 100)) : 0;
      githubValidationProgressFill.style.width = `${percent}%`;
      githubValidationProgress.setAttribute('aria-valuenow', String(percent));
      githubValidationProgress.setAttribute('aria-valuetext', total
        ? `${processed} de ${total} testes concluídos`
        : 'Preparando lista de testes');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function groupFindingsByLink(findings) {
      return findings.reduce((grouped, finding) => {
        const linkId = finding.link_id || '';
        if (!grouped[linkId]) grouped[linkId] = [];
        grouped[linkId].push(finding);
        return grouped;
      }, {});
    }

    function groupValidationsByLink(validations) {
      return validations.reduce((grouped, validation) => {
        const linkId = validation.link_id || '';
        if (!grouped[linkId]) grouped[linkId] = [];
        grouped[linkId].push(validation);
        return grouped;
      }, {});
    }

    function badgeClassForStatus(status) {
      if (['falhou', 'falso_positivo', 'erro_compilacao', 'erro_ferramenta', 'nao_validavel'].includes(status)) return 'badge-error';
      if (['concluido', 'arquivos_descobertos', 'triagem_concluida', 'confirmado', 'detectado', 'executado'].includes(status)) return 'badge-success';
      return '';
    }

    function renderFindingActions(finding) {
      const statuses = [
        ['confirmado', 'Confirmar'],
        ['falso_positivo', 'Falso positivo'],
        ['ignorado', 'Ignorar'],
        ['suspeito', 'Reabrir']
      ];
      return statuses.map(([status, label]) => `
        <button
          type="button"
          class="${status === 'falso_positivo' ? 'button-danger' : 'button-plain'}"
          data-finding-id="${escapeHtml(finding.id)}"
          data-finding-status="${status}"
          ${finding.status === status ? 'disabled' : ''}
        >
          ${label}
        </button>
      `).join('');
    }

    function findingRowsForLink(linkId) {
      return currentFindings.filter((finding) => finding.link_id === linkId);
    }

    function validationRowsForFinding(findingId) {
      return currentValidations.filter((validation) => validation.finding_id === findingId);
    }

    function uniqueSorted(values) {
      return [...new Set(values.filter(Boolean))].sort((left, right) => left.localeCompare(right));
    }

    function validationClassForFinding(findingId) {
      const validations = validationRowsForFinding(findingId);
      if (!validations.length) return 'sem_validacao';
      if (validations.some((validation) => validation.classification === 'detectado')) return 'detectado';
      if (validations.some((validation) => validation.classification === 'erro_compilacao')) return 'erro_compilacao';
      if (validations.some((validation) => validation.classification === 'erro_ferramenta')) return 'erro_ferramenta';
      if (validations.some((validation) => validation.classification === 'nao_validavel')) return 'nao_validavel';
      return validations[0].classification || 'executado';
    }

    function filteredFindingsForModal(findings) {
      return findings.filter((finding) => {
        const validationClass = validationClassForFinding(finding.id);
        return (!currentFindingFilters.category || finding.category === currentFindingFilters.category)
          && (!currentFindingFilters.priority || finding.priority === currentFindingFilters.priority)
          && (!currentFindingFilters.status || finding.status === currentFindingFilters.status)
          && (!currentFindingFilters.validation || validationClass === currentFindingFilters.validation);
      });
    }

    function renderFilterOptions(values, selectedValue) {
      return values.map((value) => `
        <option value="${escapeHtml(value)}" ${value === selectedValue ? 'selected' : ''}>
          ${escapeHtml(value)}
        </option>
      `).join('');
    }

    function renderModalSummary(linkFindings, filteredFindings) {
      const highPriority = linkFindings.filter((finding) => finding.priority === 'alta').length;
      const confirmed = linkFindings.filter((finding) => finding.status === 'confirmado').length;
      const falsePositive = linkFindings.filter((finding) => finding.status === 'falso_positivo').length;
      const detected = linkFindings.filter((finding) => validationClassForFinding(finding.id) === 'detectado').length;

      return `
        <div class="modal-summary">
          <span class="badge">${filteredFindings.length} visíveis</span>
          <span class="badge">${linkFindings.length} total</span>
          <span class="badge">${highPriority} prioridade alta</span>
          <span class="badge ${confirmed ? 'badge-success' : ''}">${confirmed} confirmados</span>
          <span class="badge ${falsePositive ? 'badge-error' : ''}">${falsePositive} falsos positivos</span>
          <span class="badge ${detected ? 'badge-success' : ''}">${detected} detectados</span>
        </div>
      `;
    }

    function renderModalFilters(linkFindings) {
      const categories = uniqueSorted(linkFindings.map((finding) => finding.category));
      const priorities = uniqueSorted(linkFindings.map((finding) => finding.priority));
      const statuses = uniqueSorted(linkFindings.map((finding) => finding.status));
      const validationClasses = uniqueSorted(linkFindings.map((finding) => validationClassForFinding(finding.id)));

      return `
        <div class="modal-filters">
          <label>Categoria
            <select data-finding-filter="category">
              <option value="">Todas</option>
              ${renderFilterOptions(categories, currentFindingFilters.category)}
            </select>
          </label>
          <label>Prioridade
            <select data-finding-filter="priority">
              <option value="">Todas</option>
              ${renderFilterOptions(priorities, currentFindingFilters.priority)}
            </select>
          </label>
          <label>Status
            <select data-finding-filter="status">
              <option value="">Todos</option>
              ${renderFilterOptions(statuses, currentFindingFilters.status)}
            </select>
          </label>
          <label>Validação
            <select data-finding-filter="validation">
              <option value="">Todas</option>
              ${renderFilterOptions(validationClasses, currentFindingFilters.validation)}
            </select>
          </label>
        </div>
      `;
    }

    function logUrl(logFile) {
      const value = String(logFile || '').trim();
      if (!value) return '';
      if (value.startsWith('outputs/') || value.startsWith('reports/')) {
        return `/${value}`;
      }
      return '';
    }

    function renderLogValue(logFile) {
      const url = logUrl(logFile);
      if (!url) return escapeHtml(logFile || '-');
      return `
        <button
          type="button"
          class="log-link"
          data-log-url="${escapeHtml(url)}"
          data-log-file="${escapeHtml(logFile)}"
        >
          ${escapeHtml(logFile)}
        </button>
      `;
    }

    function renderValidations(validations) {
      if (!validations.length) {
        return '<p class="message">Nenhuma validação por ferramenta registrada para este achado.</p>';
      }

      return `
        <div class="validation-list">
          ${validations.map((validation) => `
            <section class="validation-item">
              <div class="link-meta">
                <span class="badge">${escapeHtml(validation.tool || 'ferramenta')}</span>
                <span class="badge ${badgeClassForStatus(validation.status)}">${escapeHtml(validation.status || '-')}</span>
                <span class="badge ${badgeClassForStatus(validation.classification)}">${escapeHtml(validation.classification || '-')}</span>
                <span class="badge">retorno ${escapeHtml(validation.returncode || '-')}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Log</span>
                <span class="detail-value">${renderLogValue(validation.log_file)}</span>
              </div>
              ${validation.error ? `<div class="message error">${escapeHtml(validation.error)}</div>` : ''}
            </section>
          `).join('')}
        </div>
      `;
    }

    function renderFindingItems(findings) {
      if (!findings.length) {
        return '<section class="empty">Nenhum achado nesta pagina.</section>';
      }

      return findings.map((finding) => `
        <article class="finding-item">
          <div class="finding-topline">
            <div>
              <div class="finding-message">${escapeHtml(finding.message)}</div>
              <div class="link-meta">
                <span class="badge">${escapeHtml(finding.id)}</span>
                <span class="badge">${escapeHtml(finding.category)}</span>
                <span class="badge">severidade: ${escapeHtml(finding.severity)}</span>
                <span class="badge">prioridade: ${escapeHtml(finding.priority)}</span>
                <span class="badge ${badgeClassForStatus(finding.status)}">${escapeHtml(finding.status)}</span>
              </div>
            </div>
            <span class="badge">linha ${escapeHtml(finding.line || '-')}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Arquivo</span>
            <span class="detail-value">${escapeHtml(finding.file_path)}</span>
          </div>
          <div class="link-meta">
            <span class="badge">contexto ${escapeHtml(finding.context_start_line || '-')}-${escapeHtml(finding.context_end_line || '-')}</span>
          </div>
          <pre class="finding-evidence">${escapeHtml(finding.evidence || '-')}</pre>
          <pre class="finding-evidence">${escapeHtml(finding.context || 'contexto não registrado')}</pre>
          <div class="detail-item">
            <span class="detail-label">Validações por ferramenta</span>
            ${renderValidations(validationRowsForFinding(finding.id))}
          </div>
          <div class="finding-actions">
            <button type="button" class="button-secondary" data-validate-finding-id="${escapeHtml(finding.id)}">
              Testar somente este achado
            </button>
            ${renderFindingActions(finding)}
          </div>
        </article>
      `).join('');
    }

    function renderFindingsModal() {
      const link = currentLinks.find((item) => item.id === currentModalLinkId);
      const linkFindings = findingRowsForLink(currentModalLinkId);
      const filteredFindings = filteredFindingsForModal(linkFindings);
      const totalPages = Math.max(Math.ceil(filteredFindings.length / findingsPageSize), 1);
      currentFindingPage = Math.min(Math.max(currentFindingPage, 0), totalPages - 1);
      const start = currentFindingPage * findingsPageSize;
      const pageFindings = filteredFindings.slice(start, start + findingsPageSize);

      modalTitle.textContent = `Achados de ${currentModalLinkId || '-'}`;
      modalSubtitle.textContent = link ? link.url : '';
      modalBody.innerHTML = `
        <section class="modal-panel">
          ${renderModalSummary(linkFindings, filteredFindings)}
          ${renderModalFilters(linkFindings)}
        </section>
        <div class="finding-list">${renderFindingItems(pageFindings)}</div>
      `;

      if (!filteredFindings.length) {
        pageLabel.textContent = '0 achados';
      } else {
        const end = Math.min(start + pageFindings.length, filteredFindings.length);
        pageLabel.textContent = `${start + 1}-${end} de ${filteredFindings.length} achados`;
      }
      prevPageButton.disabled = currentFindingPage === 0;
      nextPageButton.disabled = currentFindingPage >= totalPages - 1;
    }

    function openFindingsModal(linkId) {
      currentModalLinkId = linkId;
      currentFindingPage = 0;
      currentFindingFilters = {
        category: '',
        priority: '',
        status: '',
        validation: ''
      };
      renderFindingsModal();
      modalBackdrop.classList.add('is-open');
      document.body.classList.add('modal-open');
      closeModalButton.focus();
    }

    function closeFindingsModal() {
      modalBackdrop.classList.remove('is-open');
      document.body.classList.remove('modal-open');
      currentModalLinkId = '';
      currentFindingPage = 0;
      currentFindingFilters = {
        category: '',
        priority: '',
        status: '',
        validation: ''
      };
    }

    async function openLogModal(logUrlValue, logFile) {
      logModalTitle.textContent = 'Saída da ferramenta';
      logModalSubtitle.textContent = logFile || logUrlValue;
      logModalContent.textContent = 'Carregando...';
      logModalBackdrop.classList.add('is-open');
      document.body.classList.add('modal-open');
      closeLogModalButton.focus();

      try {
        const response = await fetch(logUrlValue);
        const text = await response.text();
        if (!response.ok) {
          let message = text || `falha ao abrir log (${response.status})`;
          try {
            const payload = JSON.parse(text);
            message = [
              payload.error || `falha ao abrir log (${response.status})`,
              payload.path ? `Arquivo: ${payload.path}` : '',
              payload.hint || ''
            ].filter(Boolean).join('\n');
          } catch (parseError) {}
          throw new Error(message);
        }
        logModalContent.textContent = text || 'Log vazio.';
      } catch (error) {
        logModalContent.textContent = error.message;
      }
    }

    function closeLogModal() {
      logModalBackdrop.classList.remove('is-open');
      if (!modalBackdrop.classList.contains('is-open')) {
        document.body.classList.remove('modal-open');
      }
      logModalSubtitle.textContent = '';
      logModalContent.textContent = '';
    }

    function nextStageAction(link, linkFindings) {
      const canFetch = link.url_type === 'repo' && ['pendente', 'falhou'].includes(link.status);
      const canDiscover = Boolean(link.local_path) && Number(link.file_count || 0) === 0;
      const canTriage = Number(link.file_count || 0) > 0 && !linkFindings.length;

      if (canFetch) {
        return {
          label: 'Baixar repositório',
          state: 'Próxima etapa: obter código',
          attr: 'data-fetch-id'
        };
      }
      if (canDiscover) {
        return {
          label: 'Listar arquivos',
          state: 'Próxima etapa: mapear código C',
          attr: 'data-discover-id'
        };
      }
      if (canTriage) {
        return {
          label: 'Gerar achados',
          state: 'Próxima etapa: triagem estática',
          attr: 'data-triage-id'
        };
      }
      if (linkFindings.length) {
        return {
          label: 'Abrir achados',
          state: 'Etapa atual: revisar resultados',
          attr: 'data-review-id'
        };
      }
      return {
        label: 'Aguardando dados',
        state: 'Etapa atual: sem ação disponível',
        attr: ''
      };
    }

    function renderStageActions(link, linkFindings) {
      const action = nextStageAction(link, linkFindings);
      const actionAttr = action.attr ? `${action.attr}="${escapeHtml(link.id)}"` : '';
      const buttonClass = action.attr === 'data-review-id' ? 'button-secondary' : '';
      const actionButton = action.attr
        ? `<button type="button" class="${buttonClass}" ${actionAttr}>${escapeHtml(action.label)}</button>`
        : '';

      return `
        <div class="stage-actions">
          <span class="stage-label">${escapeHtml(action.state)}</span>
          <div class="actions">
            ${actionButton}
            <button type="button" class="button-danger" data-remove-id="${escapeHtml(link.id)}">
              Remover
            </button>
          </div>
        </div>
      `;
    }

    function renderReviewSummary(link, linkFindings, linkValidations) {
      if (!linkFindings.length) return '';

      const confirmed = linkFindings.filter((finding) => finding.status === 'confirmado').length;
      const highPriority = linkFindings.filter((finding) => finding.priority === 'alta').length;
      const detected = linkValidations.filter((validation) => validation.classification === 'detectado').length;
      return `
        <section class="review-summary">
          <div class="link-meta">
            <span class="badge">${linkFindings.length} achados</span>
            <span class="badge">${highPriority} prioridade alta</span>
            <span class="badge ${confirmed ? 'badge-success' : ''}">${confirmed} confirmados</span>
            <span class="badge">${linkValidations.length} validacoes</span>
            <span class="badge ${detected ? 'badge-success' : ''}">${detected} detectados</span>
          </div>
          <div class="review-actions">
            <button type="button" class="button-secondary" data-review-id="${escapeHtml(link.id)}">
              Revisar achados
            </button>
            <button type="button" class="button-secondary" data-validate-link-id="${escapeHtml(link.id)}">
              Testar achados
            </button>
          </div>
        </section>
      `;
    }

    function renderLinks(links, findings = [], validations = []) {
      if (!links.length) {
        container.innerHTML = '<section class="empty">Nenhum link registrado.</section>';
        return;
      }

      const findingsByLink = groupFindingsByLink(findings);
      const validationsByLink = groupValidationsByLink(validations);
      const cards = links.map((link) => {
        const statusClass = badgeClassForStatus(link.status);
        const linkFindings = findingsByLink[link.id] || [];
        const linkValidations = validationsByLink[link.id] || [];
        return `
        <article class="link-card">
          <div class="link-card-header">
            <div>
              <a class="link-url" href="${escapeHtml(link.url)}">${escapeHtml(link.url)}</a>
              <div class="link-meta">
                <span class="badge">${escapeHtml(link.id)}</span>
                <span class="badge ${statusClass}">${escapeHtml(link.status)}</span>
                <span class="badge">${escapeHtml(link.url_type || 'tipo pendente')}</span>
              </div>
            </div>
            ${renderStageActions(link, linkFindings)}
          </div>
          <div class="link-details">
            <div class="detail-item">
              <span class="detail-label">Arquivos</span>
              <span class="detail-value">${escapeHtml(link.file_count || 0)}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Achados</span>
              <span class="detail-value">${escapeHtml(link.finding_count || 0)}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Enviado em</span>
              <span class="detail-value">${escapeHtml(link.submitted_at)}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Início</span>
              <span class="detail-value">${escapeHtml(link.started_at || '-')}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Fim</span>
              <span class="detail-value">${escapeHtml(link.finished_at || '-')}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Caminho local</span>
              <span class="detail-value">${escapeHtml(link.local_path || '-')}</span>
            </div>
          </div>
          ${link.error ? `<div class="message error">${escapeHtml(link.error)}</div>` : ''}
          ${renderReviewSummary(link, linkFindings, linkValidations)}
        </article>
      `;
      }).join('');

      container.innerHTML = `
        <section class="links-list">${cards}</section>
      `;
    }

    function describeGithubValidationRun(run) {
      const status = run.status || 'idle';
      const count = Number(run.count || 0);
      const processed = Number(run.processed || 0);
      const total = Number(run.total || 0);
      const limit = run.limit ? `limite ${run.limit}` : 'todos os candidatos';
      const timeout = run.timeout ? `timeout ${run.timeout}s` : 'timeout padrão';
      const progressText = total
        ? `${processed}/${total} testes concluídos`
        : 'preparando lista de testes';
      const currentText = run.current_finding_id
        ? ` Achado atual: ${escapeHtml(run.current_finding_id)}${run.current_tool ? ` (${escapeHtml(run.current_tool)})` : ''}.`
        : '';
      const logLink = run.log_file
        ? ` <a href="/${escapeHtml(run.log_file)}" target="_blank" rel="noopener">Ver log</a>`
        : '';

      if (status === 'running') {
        return {
          text: `Rodando testes GitHub: ${progressText}. ${currentText} (${limit}, ${timeout}) desde ${escapeHtml(run.started_at || '-')}.${logLink}`,
          type: ''
        };
      }
      if (status === 'succeeded') {
        return {
          text: `Testes GitHub concluídos: ${count} registros. Fim: ${escapeHtml(run.finished_at || '-')}.${logLink}`,
          type: 'success'
        };
      }
      if (status === 'failed') {
        return {
          text: `Falha nos testes GitHub após ${processed}/${total || '?'} testes: ${escapeHtml(run.error || 'erro não informado')}.${logLink}`,
          type: 'error'
        };
      }
      return {
        text: 'Pronto para rodar todos os achados.',
        type: ''
      };
    }

    function scheduleGithubValidationPoll() {
      if (githubValidationPollTimer) return;
      githubValidationPollTimer = window.setInterval(refreshGithubValidationRun, 3000);
    }

    function stopGithubValidationPoll() {
      if (!githubValidationPollTimer) return;
      window.clearInterval(githubValidationPollTimer);
      githubValidationPollTimer = null;
    }

    async function refreshGithubValidationRun() {
      const response = await fetch('/api/github-validations/run');
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || 'falha ao consultar validações GitHub');
      }

      const run = data.run || {};
      const description = describeGithubValidationRun(run);
      setGithubValidationStatus(description.text, description.type);
      setGithubValidationProgress(run);
      runGithubValidationsButton.disabled = run.status === 'running';

      if (run.status === 'running') {
        scheduleGithubValidationPoll();
        return run;
      }

      stopGithubValidationPoll();
      if (run.status === 'succeeded' || run.status === 'failed') {
        await loadLinks();
      }
      return run;
    }

    async function runGithubValidations() {
      if (!window.confirm('Rodar os testes de todos os achados dos links GitHub agora? A execução pode demorar alguns minutos.')) return;
      runGithubValidationsButton.disabled = true;
      setGithubValidationStatus('Iniciando validações GitHub...');
      setGithubValidationProgress({status: 'running', processed: 0, total: 0});
      try {
        const response = await fetch('/api/github-validations/run', {method: 'POST'});
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'falha ao iniciar validações GitHub');
        }
        const description = describeGithubValidationRun(data.run || {});
        setGithubValidationStatus(description.text, description.type);
        setGithubValidationProgress(data.run || {});
        scheduleGithubValidationPoll();
      } catch (error) {
        setGithubValidationStatus(error.message, 'error');
        setGithubValidationProgress();
        runGithubValidationsButton.disabled = false;
      }
    }

    async function loadLinks() {
      const [linksResponse, findingsResponse, validationsResponse] = await Promise.all([
        fetch('/api/github-links'),
        fetch('/api/github-findings'),
        fetch('/api/github-validations')
      ]);
      const linksData = await linksResponse.json();
      const findingsData = await findingsResponse.json();
      const validationsData = await validationsResponse.json();
      currentLinks = linksData.links || [];
      currentFindings = findingsData.findings || [];
      currentValidations = validationsData.validations || [];
      renderLinks(currentLinks, currentFindings, currentValidations);
      if (modalBackdrop.classList.contains('is-open')) {
        renderFindingsModal();
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      setMessage('');

      try {
        const response = await fetch('/api/github-links', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({url: urlInput.value})
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'falha ao registrar link');
        }

        urlInput.value = '';
        if (data.link.status === 'falhou') {
          setMessage(`Link registrado com falha: ${data.link.error}`, 'error');
        } else {
          setMessage(`Link registrado: ${data.link.id}`, 'success');
        }
        await loadLinks();
      } catch (error) {
        setMessage(error.message, 'error');
      } finally {
        button.disabled = false;
        urlInput.focus();
      }
    });

    async function updateFindingStatus(findingId, findingStatus, clickedButton) {
      clickedButton.disabled = true;
      setMessage(`Atualizando ${findingId}...`);
      try {
        const response = await fetch(`/api/github-findings/${findingId}`, {
          method: 'PATCH',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({status: findingStatus})
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'falha ao atualizar achado');
        }

        setMessage(`Achado marcado como ${data.finding.status}: ${data.finding.id}`, 'success');
        await loadLinks();
      } catch (error) {
        setMessage(error.message, 'error');
        await loadLinks();
      }
    }

    async function runValidation(endpoint, label, clickedButton) {
      clickedButton.disabled = true;
      setMessage(`Rodando testes de ${label}...`);

      try {
        const response = await fetch(endpoint, {
          method: 'POST'
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'falha ao rodar testes');
        }

        setMessage(`Testes finalizados para ${label}: ${data.count} validações registradas.`, 'success');
        await loadLinks();
      } catch (error) {
        setMessage(error.message, 'error');
        await loadLinks();
      } finally {
        clickedButton.disabled = false;
      }
    }

    container.addEventListener('click', async (event) => {
      const fetchId = event.target.dataset.fetchId;
      const discoverId = event.target.dataset.discoverId;
      const triageId = event.target.dataset.triageId;
      const removeId = event.target.dataset.removeId;
      const reviewId = event.target.dataset.reviewId;
      const validateLinkId = event.target.dataset.validateLinkId;
      const findingId = event.target.dataset.findingId;
      const findingStatus = event.target.dataset.findingStatus;
      if (!fetchId && !discoverId && !triageId && !removeId && !reviewId && !validateLinkId && !findingId) return;

      if (findingId) {
        await updateFindingStatus(findingId, findingStatus, event.target);
        return;
      }

      if (reviewId) {
        openFindingsModal(reviewId);
        return;
      }

      if (validateLinkId) {
        await runValidation(
          `/api/github-links/${validateLinkId}/validate`,
          validateLinkId,
          event.target
        );
        return;
      }

      if (removeId) {
        if (!window.confirm(`Remover ${removeId} da lista?`)) return;
        event.target.disabled = true;
        setMessage(`Removendo ${removeId}...`);
        try {
          const response = await fetch(`/api/github-links/${removeId}`, {
            method: 'DELETE'
          });
          const data = await response.json();

          if (!response.ok) {
          throw new Error(data.error || 'falha ao remover link');
          }

          setMessage(`Link removido: ${data.removed_id}`, 'success');
          await loadLinks();
        } catch (error) {
          setMessage(error.message, 'error');
          await loadLinks();
        }
        return;
      }

      event.target.disabled = true;
      const actionId = fetchId || discoverId || triageId;
      const actionName = fetchId
        ? 'Baixando'
        : discoverId
          ? 'Descobrindo arquivos de'
          : 'Executando triagem de';
      const endpoint = fetchId
        ? `/api/github-links/${fetchId}/fetch`
        : discoverId
          ? `/api/github-links/${discoverId}/discover`
          : `/api/github-links/${triageId}/triage`;
      setMessage(`${actionName} ${actionId}...`);

      try {
        const response = await fetch(endpoint, {
          method: 'POST'
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'falha ao executar ação');
        }

        if (fetchId) {
          setMessage(`Repositório baixado: ${data.link.local_path}`, 'success');
        } else if (discoverId) {
          setMessage(`Arquivos encontrados: ${data.link.file_count}`, 'success');
        } else {
          setMessage(`Achados registrados: ${data.link.finding_count}`, 'success');
        }
        await loadLinks();
      } catch (error) {
        setMessage(error.message, 'error');
        await loadLinks();
      }
    });

    modalBody.addEventListener('click', async (event) => {
      const logButton = event.target.closest('[data-log-url]');
      if (logButton) {
        await openLogModal(logButton.dataset.logUrl, logButton.dataset.logFile);
        return;
      }

      const validateFindingId = event.target.dataset.validateFindingId;
      const findingId = event.target.dataset.findingId;
      const findingStatus = event.target.dataset.findingStatus;
      if (validateFindingId) {
        await runValidation(
          `/api/github-findings/${validateFindingId}/validate`,
          validateFindingId,
          event.target
        );
        return;
      }
      if (!findingId) return;

      await updateFindingStatus(findingId, findingStatus, event.target);
    });

    closeModalButton.addEventListener('click', closeFindingsModal);
    closeLogModalButton.addEventListener('click', closeLogModal);

    modalBackdrop.addEventListener('click', (event) => {
      if (event.target === modalBackdrop) {
        closeFindingsModal();
      }
    });

    logModalBackdrop.addEventListener('click', (event) => {
      if (event.target === logModalBackdrop) {
        closeLogModal();
      }
    });

    prevPageButton.addEventListener('click', () => {
      currentFindingPage -= 1;
      renderFindingsModal();
    });

    nextPageButton.addEventListener('click', () => {
      currentFindingPage += 1;
      renderFindingsModal();
    });

    runGithubValidationsButton.addEventListener('click', runGithubValidations);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && logModalBackdrop.classList.contains('is-open')) {
        closeLogModal();
        return;
      }
      if (event.key === 'Escape' && modalBackdrop.classList.contains('is-open')) {
        closeFindingsModal();
      }
    });

    loadLinks().catch((error) => setMessage(error.message, 'error'));
    refreshGithubValidationRun().catch((error) => setGithubValidationStatus(error.message, 'error'));
  </script>
</body>
</html>
